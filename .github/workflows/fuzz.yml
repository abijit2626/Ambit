# A long fuzz round, every night, over every fuzz target.
#
# The check workflow fuzzes each target for 10,000 inputs on every pull request, which keeps a
# pull request's CI near two minutes. Every run past that count has found a bug the short round
# missed, most of them in the Bash classifier, so the longer round runs here on a schedule rather
# than by hand. It runs `make fuzz` at its default count, 100,000 inputs per target, and keeps
# going after a failure so one failing target does not hide another.
#
# When a target fails, Go writes the failing input under that package's testdata/fuzz/. The job
# uploads every such new file as the fuzz-failures artifact. To reproduce one, copy it to the same
# path in a checkout and run `go test ./<package> -run '<Target>/<file>'`; commit it with the fix
# so it stays a seed.

name: fuzz

on:
  schedule:
    # 03:17 UTC daily: off the hour, when scheduled runs queue less.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Inputs per target, as a count ("100000x") or a duration ("5m")'
        required: false
        default: '100000x'

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: make fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '100000x' }}
        run: make fuzz FUZZTIME="$FUZZTIME" FUZZ_KEEP_GOING=1

      - name: Collect failing inputs
        if: failure()
        run: |
          mkdir -p fuzz-failures
          git status --porcelain --untracked-files=all -- '*/testdata/fuzz/*' |
            awk '$1 == "??" { print $2 }' |
            while read -r f; do
              mkdir -p "fuzz-failures/$(dirname "$f")"
              cp "$f" "fuzz-failures/$f"
            done
          find fuzz-failures -type f | sort

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-failures
          path: fuzz-failures/
          if-no-files-found: ignore
          retention-days: 30
