# M0, Windows. SCA policy for the observation-only managed-settings bundle: a SUBSET of
# ambit_managed_settings_windows.yml. This is detector D12 on a native Windows endpoint
# while nothing is enforced.
#
# WHY A SECOND FILE. deploy/claude-code/managed-settings.m0.json sets no permission rules,
# because M0's exit criterion is zero developer-visible behavior change. The full Windows
# policy asserts one such key:
#
#   10002  permissions.disableBypassPermissionsMode is "disable"
#
# Deploy the full policy against the M0 bundle and that check fails on every endpoint, which
# makes rule 100270 (level 12) fire on each scan and 100271 (level 13) when it persists. This
# file keeps the five checks the M0 bundle satisfies and drops that one. The sandbox checks
# 10003 and 10004 are absent from the Windows policy for a different reason, explained in
# ambit_managed_settings_windows.yml.
#
# DEPLOY EXACTLY ONE of the two Windows files per agent. This one declares the SAME policy id
# and the SAME check ids as the full policy, so the manager rules (which match
# sca.policy_id ^ambit_managed_settings$ and sca.check.id) are shared and unchanged.
#
# SWITCH TO THE FULL POLICY when the enforcement keys ship in managed settings (M3). Until
# then 10002 is not failing; it is not asserted.
#
# Every check below is copied verbatim from ambit_managed_settings_windows.yml, and
# deploy/wazuh/sca_test.go fails if one drifts, and also evaluates each against the M0 bundle.
#
# NOT VERIFIED ON A LIVE WINDOWS AGENT: the same items the full Windows policy lists. See
# "Windows agents" in deploy/wazuh/README.md. SCA also regex-matches file TEXT; treat this as
# a tripwire on a known-good file, not as a parser.

policy:
  id: "ambit_managed_settings"
  file: "ambit_managed_settings_windows_m0.yml"
  name: "ambit: Claude Code managed settings assertions (Windows, M0, observation only)"
  description: "Asserts the observation-only managed-settings bundle and ambitd are present and correct on Windows. A subset of the full policy."
  references:
    - https://code.claude.com/docs/en/managed-settings
    - https://code.claude.com/docs/en/sandboxing
  regex_type: "pcre2"

requirements:
  title: "Claude Code is installed on this endpoint"
  description: "Skip the whole policy where Claude Code is not deployed, so unrelated endpoints do not report a wall of failures. Evidence of Claude Code that does NOT depend on the managed-settings bundle must be among the rules: if the only evidence were the bundle's own directory, deleting the bundle would make the policy not applicable and 10001 would never fail, which is the one condition D12 exists to catch. Claude Code is usually installed per user, which the agent (SYSTEM) does not see on its PATH, so the rules also look for what a per-user install leaves in every profile."
  condition: any
  rules:
    - 'd:C:\Program Files\ClaudeCode'
    - 'c:powershell.exe -NoProfile -Command "if ((Get-Command claude -ErrorAction SilentlyContinue) -or (Test-Path ''C:\Users\*\.claude'') -or (Test-Path ''C:\Users\*\.local\bin\claude.exe'') -or (Test-Path ''C:\Users\*\AppData\Roaming\npm\claude.cmd'')) { Write-Output claude-found }" -> r:claude-found'

checks:
  - id: 10001
    title: "Managed settings bundle is present"
    description: "Managed settings sit at the highest precedence: no other level, including command-line arguments, overrides a managed permission rule. On Windows Claude Code reads C:\\Program Files\\ClaudeCode\\managed-settings.json and does not read the legacy C:\\ProgramData location."
    rationale: "Without the bundle, every control below is unenforced and user or project settings decide policy."
    remediation: "Redeploy the managed-settings bundle via Intune, Group Policy or another device-management tool."
    compliance:
      - ambit: ["anchor"]
    condition: any
    rules:
      - 'f:C:\Program Files\ClaudeCode\managed-settings.json'

  - id: 10005
    title: "The PreToolUse hook points at ambitd on loopback"
    description: "A managed PreToolUse hook must target 127.0.0.1, which is where ambitd listens."
    rationale: "If the hook is absent, ambitd sees nothing and the event stream silently stops while the endpoint still heartbeats. If it points anywhere but loopback, tool-call decisions have left the machine."
    remediation: "Restore the managed hooks block."
    compliance:
      - ambit: ["D7"]
    condition: any
    rules:
      - 'f:C:\Program Files\ClaudeCode\managed-settings.json -> r:"url"\s*:\s*"http://127\.0\.0\.1:\d+/hook"'

  - id: 10006
    title: "OpenTelemetry destination is pinned to loopback on the OTLP/HTTP port"
    description: "OTEL_EXPORTER_OTLP_ENDPOINT must point at 127.0.0.1:4318."
    rationale: >
      Set in managed settings, developer-set telemetry variables are removed, which
      is what makes OTel a tamper-resistant second stream independent of the hook
      path. The port matters: 4318 is OTLP/HTTP and 4317 is gRPC, and an endpoint
      on the wrong port exports into nothing while still looking configured.
    remediation: "Set the OTEL_* env block in managed settings with endpoint http://127.0.0.1:4318."
    compliance:
      - ambit: ["D7"]
    condition: any
    rules:
      - 'f:C:\Program Files\ClaudeCode\managed-settings.json -> r:OTEL_EXPORTER_OTLP_ENDPOINT.*127\.0\.0\.1:4318'

  - id: 10008
    title: "OTLP protocol is http/json"
    description: "OTEL_EXPORTER_OTLP_PROTOCOL must be http/json."
    rationale: >
      ambitd's receiver decodes OTLP/JSON only. A grpc or http/protobuf setting
      means Claude Code exports in an encoding ambitd cannot read, so the second
      stream is silently absent. ambitd answers 415 and reports degraded health,
      but this check catches the misconfiguration before it reaches an endpoint.
    remediation: "Set OTEL_EXPORTER_OTLP_PROTOCOL to http/json in managed settings."
    compliance:
      - ambit: ["D7"]
    condition: any
    rules:
      - 'f:C:\Program Files\ClaudeCode\managed-settings.json -> r:"OTEL_EXPORTER_OTLP_PROTOCOL"\s*:\s*"http/json"'

  - id: 10007
    title: "ambitd process is running"
    description: "The endpoint daemon must be alive."
    rationale: >
      This check runs on the WAZUH AGENT's schedule, in a different process from
      the one it is watching, which is the whole point when the adversary can kill
      processes. It is deliberately weak on its own: it confirms a process by name
      and says nothing about whether it is functioning, so a wedged ambitd passes.
      The companion signal is a stale ambitd_health heartbeat with this check
      passing. See docs/03-detection.md on D7's two halves.

      The name is matched exactly by Get-Process -Name ambitd, which is the
      ambiguity the Unix policy avoids by naming the daemon ambitd rather than
      agentd: Wazuh ships wazuh-agent.exe on every monitored endpoint, and a
      substring match on "agent" would pass whether or not our daemon is alive.
    remediation: "Start the ambitd service or scheduled task and investigate why it stopped."
    compliance:
      - ambit: ["D7", "D11"]
      - mitre_technique: ["T1562.001"]
    condition: all
    rules:
      - 'c:powershell.exe -NoProfile -Command "if (Get-Process -Name ambitd -ErrorAction SilentlyContinue) { Write-Output ambitd-running } else { Write-Output ambitd-missing }" -> r:^ambitd-running'
